spring:
  application:
    name: sistema-venda-ingressos-icb
  profiles:
    default: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Configuração da aplicação (não-Spring). Ver docs/regrasDeNegocio.md.
app:
  # Estratégia de persistência ativa: memoria | postgres
  persistencia: memoria
  reserva:
    # TTL da reserva não paga (RN-2). Formato ISO-8601 Duration.
    ttl: PT15M
    # Intervalo entre varreduras do scheduler de expiração (RF-17). ISO-8601 Duration.
    intervalo-varredura: PT1M
  webhook:
    # Segredo esperado no header X-Webhook-Token do webhook de pagamento (RF-16).
    # Em produção vem de variável de ambiente (RNF-13); em dev usa um valor fixo.
    secret: ${WEBHOOK_SECRET:troque-em-producao}
  # Autenticação do administrador (RF-19 / RN-5 / RNF-12). Em produção JWT_SECRET,
  # ADMIN_EMAIL e ADMIN_SENHA_HASH são obrigatórios via ambiente (RNF-13).
  jwt:
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-com-32-bytes-no-minimo}
    # Validade do token a partir da emissão. ISO-8601 Duration.
    expiracao: PT2H
  admin:
    email: ${ADMIN_EMAIL:admin@icb.local}
    # Hash BCrypt da senha. Em dev corresponde a "admin123".
    senha-hash: "${ADMIN_SENHA_HASH:$2a$10$ptB66Imh26f.qkhzCyUl5uw7N/8vZ4Oy0JipYcl/valf0JwhqmyB2}"
  # CORS restrito ao(s) domínio(s) do frontend (RNF-16). Lista separada por vírgula.
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    br.com.icb.ingressos: DEBUG

app:
  persistencia: memoria
  webhook:
    secret: dev-webhook-secret

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    br.com.icb.ingressos: INFO

app:
  persistencia: postgres
  # Em produção, obrigatórios por ambiente (RNF-13) — sem default utilizável:
  #   JWT_SECRET, ADMIN_EMAIL, ADMIN_SENHA_HASH, CORS_ORIGINS, WEBHOOK_SECRET

# Contrato OpenAPI só é publicado fora de produção (RNF-36 atende o time de frontend).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
